# ReadyStack NATS Server configuration: one server, JetStream on.
# The entrypoint (/usr/local/bin/readystack-entrypoint.sh) adds an authorization block with NATS_USER /
# NATS_PASSWORD to a runtime copy of this file (/var/lib/nats/nats-server.conf, mode 600) and starts
# nats-server with that copy. This file itself holds no credentials.

# Client connections (the NATS protocol).
listen: 0.0.0.0:4222

# HTTP monitoring: /healthz, /varz, /connz, /subsz, /jsz, /accountz, /routez. NATS gives it no
# authentication of its own, so keep port 8222 on a private network.
http: 0.0.0.0:8222

# JetStream (streams, consumers, key-value and object stores) persists under /data/jetstream.
# With no max_memory_store / max_file_store set, NATS allows up to 75% of the host's memory and of
# the free space on /data's filesystem.
jetstream {
  store_dir: "/data"
}
